name: Entrakeria
options:
  bundleIdPrefix: com.portokali
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  Entrakeria:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Colors.swift
      - Models.swift
      - WeekPlan.swift
      - TetradGeometry.swift
      - SessionManager.swift
      - EntrakeriaApp.swift
      - Views
      - Assets.xcassets
    dependencies:
      - target: EntrakeriaWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Entrakeria
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portokali.Entrakeria
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  EntrakeriaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Colors.swift
      - Models.swift
      - WeekPlan.swift
      - Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Entrakeria
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.portokali.Entrakeria
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Entrakeria reads your heart rate and energy during a workout.
        NSHealthUpdateUsageDescription: Entrakeria saves your workouts to Apple Health so they count toward your rings.
    entitlements:
      path: Watch/EntrakeriaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portokali.Entrakeria.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
